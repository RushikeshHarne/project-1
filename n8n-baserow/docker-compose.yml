
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=YOUR_VM_EXTERNAL_IP
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://8.231.77.108:5678/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - appnet

  baserow:
    image: baserow/baserow:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - BASEROW_PUBLIC_URL=http://8.231.77.108:8080
    volumes:
      - baserow_data:/baserow/data
    networks:
      - appnet

volumes:
  n8n_data:
  baserow_data:

networks:
  appnet:
    driver: bridge

